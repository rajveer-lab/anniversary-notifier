<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StaffPing — Fusion Global Business Solutions</title>
  <style>
    :root {
      --background: #090a0c;
      --surface: #111317;
      --surface-hover: #1b1e24;
      --text: #f3f4f6;
      --muted: #8a92a6;
      --border: rgba(255, 255, 255, 0.06);
      --accent: #d6001c;
      --accent-hover: #ff1a37;
      --accent-glow: rgba(214, 0, 28, 0.12);
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body.light-theme {
      --background: #f4f5f7;
      --surface: #ffffff;
      --surface-hover: #eef0f3;
      --text: #111827;
      --muted: #6b7280;
      --border: rgba(0, 0, 0, 0.08);
      --accent-glow: rgba(214, 0, 28, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-stack);
      background-color: var(--background);
      color: var(--text);
      letter-spacing: -0.01em;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.2s, color 0.2s;
    }

    /* ── HEADER ── */
    header {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: relative;
      z-index: 100;
    }
    .brand-container { display: flex; align-items: center; gap: 14px; }
    .brand-logo {
      height: 36px; width: auto; object-fit: contain;
      filter: invert(1);
    }
    body.light-theme .brand-logo { filter: invert(0); }
    .brand-title { font-size: 1.25rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
    .brand-title span { color: var(--accent); }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .btn-control {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-stack);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-control:hover { background: var(--border); }
    .btn-danger-control {
      border-color: rgba(214, 0, 28, 0.3) !important;
      color: #f87171 !important;
    }
    .btn-danger-control:hover {
      background: rgba(214, 0, 28, 0.15) !important;
      border-color: rgba(214, 0, 28, 0.6) !important;
    }
    body.light-theme .btn-danger-control {
      color: #dc2626 !important;
      border-color: rgba(220, 38, 38, 0.3) !important;
    }
    body.light-theme .btn-danger-control:hover {
      background: rgba(220, 38, 38, 0.08) !important;
      border-color: rgba(220, 38, 38, 0.6) !important;
    }
    .date-badge {
      background: var(--surface-hover);
      color: var(--text);
      border: 1px solid rgba(214, 0, 28, 0.25);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
    }

    /* ── NOTIFICATION BELL BUTTON ── */
    .notif-bell-btn {
      position: relative;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.05rem;
      width: 36px; height: 36px;
      border-radius: 6px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .notif-bell-btn:hover { background: var(--border); border-color: rgba(214,0,28,0.3); }
    .notif-bell-btn.has-unread { border-color: rgba(214,0,28,0.5); }
    .notif-badge {
      position: absolute;
      top: -5px; right: -5px;
      background: var(--accent);
      color: #fff;
      font-size: 0.6rem;
      font-weight: 700;
      min-width: 16px; height: 16px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 3px;
      border: 2px solid var(--surface);
      display: none;
    }
    .notif-badge.visible { display: flex; }

    /* ── NOTIFICATION PANEL (slide-in drawer) ── */
    .notif-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 900;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .notif-overlay.open { opacity: 1; pointer-events: all; }

    .notif-panel {
      position: fixed;
      top: 0; right: 0;
      width: 380px; height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 950;
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -12px 0 40px rgba(0,0,0,0.5);
    }
    .notif-panel.open { transform: translateX(0); }

    .notif-panel-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .notif-panel-title {
      font-size: 0.9rem; font-weight: 700; color: var(--text);
      display: flex; align-items: center; gap: 8px;
    }
    .notif-panel-title span { font-size: 1rem; }
    .notif-panel-actions { display: flex; align-items: center; gap: 8px; }

    .btn-notif-action {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-stack);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-notif-action:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }
    .btn-notif-action.danger:hover { color: #f87171; border-color: rgba(214,0,28,0.4); }

    .btn-close-panel {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .btn-close-panel:hover { color: var(--text); }

    /* Filter tabs */
    .notif-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      flex-shrink: 0;
    }
    .notif-tab {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--font-stack);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .notif-tab:hover { color: var(--text); }
    .notif-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Notification list */
    .notif-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .notif-list::-webkit-scrollbar { width: 4px; }
    .notif-list::-webkit-scrollbar-track { background: transparent; }
    .notif-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .notif-empty {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px;
      color: var(--muted);
      padding: 40px 20px;
      text-align: center;
    }
    .notif-empty-icon { font-size: 2.5rem; opacity: 0.4; }
    .notif-empty-text { font-size: 0.82rem; line-height: 1.5; }

    /* Individual notification card */
    .notif-card {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s;
      animation: slideIn 0.2s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .notif-card.unread { border-color: rgba(214, 0, 28, 0.2); }
    .notif-card-top { display: flex; align-items: flex-start; gap: 10px; }
    .notif-card-icon {
      font-size: 1.3rem;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .notif-card-body { flex: 1; min-width: 0; }
    .notif-card-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 3px;
    }
    .notif-card-msg {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.45;
      word-break: break-word;
    }
    .notif-card-unread-dot {
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }
    .notif-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .notif-card-time {
      font-size: 0.7rem;
      color: var(--muted);
      opacity: 0.7;
    }
    .notif-card-actions { display: flex; gap: 6px; }
    .btn-seen {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-stack);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .btn-seen:hover { color: #4ade80; border-color: rgba(74, 222, 128, 0.4); }
    .btn-dismiss {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-stack);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .btn-dismiss:hover { color: #f87171; border-color: rgba(214,0,28,0.4); }

    /* Type pills */
    .notif-type-pill {
      display: inline-flex; align-items: center;
      font-size: 0.62rem; font-weight: 700;
      padding: 2px 6px; border-radius: 3px;
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 2px;
    }
    .pill-birthday  { background: rgba(59,130,246,0.12); color: #93c5fd; border: 1px solid rgba(59,130,246,0.2); }
    .pill-anniversary { background: var(--accent-glow); color: #ff4d61; border: 1px solid rgba(214,0,28,0.2); }
    .pill-system    { background: rgba(234,179,8,0.1); color: #fbbf24; border: 1px solid rgba(234,179,8,0.2); }
    body.light-theme .pill-birthday { color: #1d4ed8; }
    body.light-theme .pill-anniversary { color: #b91c1c; }
    body.light-theme .pill-system { color: #92400e; }

    /* ── LAYOUT ── */
    .app-viewport { display: flex; flex: 1; height: calc(100vh - 60px); overflow: hidden; }
    .sidebar-panel {
      width: 290px;
      background-color: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px;
      display: flex; flex-direction: column;
      gap: 20px;
    }
    .panel-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .main-content { flex: 1; padding: 24px 32px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    .view-header { display: flex; align-items: center; justify-content: space-between; }
    .counter-text { font-size: 0.9rem; color: var(--muted); }
    .counter-text strong { color: var(--text); }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-group label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: var(--muted); }
    input[type="text"], input[type="date"] {
      background-color: #171a21;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-stack);
      font-size: 0.9rem;
      padding: 10px 12px;
      border-radius: 6px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus, input[type="date"]:focus { border-color: var(--accent); }
    body.light-theme input[type="text"], body.light-theme input[type="date"] { background-color: #f9fafb; color: #111827; }
    .btn-primary {
      background-color: var(--accent);
      color: #fff;
      font-family: var(--font-stack);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 11px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
    }
    .btn-primary:hover { background-color: var(--accent-hover); }
    .search-container { width: 260px; }
   /* ── CUSTOM AUTO-HIDING SCROLLBAR ── */
    
    /* Firefox Support */
    .table-container {
      scrollbar-width: thin;
      scrollbar-color: transparent transparent; 
    }
    .table-container:hover {
      scrollbar-color: var(--border) transparent;
    }

    /* WebKit Support (Chrome, Edge, Safari) */
    .table-container::-webkit-scrollbar {
      width: 6px;
    }
    .table-container::-webkit-scrollbar-track {
      background: transparent;
    }
    /* Thumb is transparent by default */
    .table-container::-webkit-scrollbar-thumb {
      background: transparent; 
      border-radius: 4px;
    }
    /* Thumb appears only when hovering over the table area */
    .table-container:hover::-webkit-scrollbar-thumb {
      background: var(--border); 
    }
    /* Thumb gets slightly darker when you actively hover over the scrollbar itself */
    .table-container::-webkit-scrollbar-thumb:hover {
      background: var(--muted); 
    }
    
    table { width: 100%; border-collapse: collapse; text-align: left; }
    
   th { 
      background: #15181e; 
      color: var(--muted); 
      font-size: 0.75rem; 
      font-weight: 600; 
      text-transform: uppercase; 
      padding: 12px 18px; 
      border-bottom: 1px solid var(--border);
      position: sticky; /* Keeps the headers frozen at the top */
      top: 0;
      z-index: 10;      /* Ensures data rows slide underneath the header */
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #15181e; color: var(--muted); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; padding: 12px 18px; border-bottom: 1px solid var(--border); }
    body.light-theme th { background: #f9fafb; }
    td { padding: 14px 18px; font-size: 0.85rem; border-bottom: 1px solid var(--border); color: var(--text); }
    .emp-id-cell { font-family: monospace; color: var(--muted); font-weight: 600; }
    .emp-name-cell { font-weight: 600; }
    body:not(.light-theme) .emp-name-cell { color: #ffffff; }
    body.light-theme .emp-name-cell { color: #111827; }
    .actions-cell { display: flex; gap: 8px; }
    .btn-table { padding: 4px 10px; font-size: 0.75rem; font-weight: 600; border-radius: 4px; cursor: pointer; font-family: var(--font-stack); background: transparent; }
    .btn-edit { border: 1px solid rgba(140,140,140,0.3); color: var(--text); }
    .btn-delete { border: 1px solid rgba(214,0,28,0.3); color: #f87171; }
    body.light-theme .btn-delete { color: #dc2626; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
    .badge-anniversary { background: var(--accent-glow); color: #ff4d61; border: 1px solid rgba(214,0,28,0.2); }
    body.light-theme .badge-anniversary { color: #b91c1c; background: rgba(214,0,28,0.08); }
    .badge-birthday { background: rgba(59,130,246,0.12); color: #93c5fd; border: 1px solid rgba(59,130,246,0.2); }
    body.light-theme .badge-birthday { color: #1d4ed8; background: rgba(59,130,246,0.08); }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: rgba(17,19,23,0.9); backdrop-filter: blur(12px);
      border: 1px solid rgba(214,0,28,0.25); border-radius: 8px;
      padding: 14px 20px; color: var(--text); box-shadow: 0 16px 32px rgba(0,0,0,0.6);
      transform: translateX(120%); opacity: 0; transition: transform 0.4s ease, opacity 0.4s ease;
      z-index: 9999; display: flex; align-items: center; gap: 12px;
      max-width: 340px;
    }
    body.light-theme .toast { background: rgba(255,255,255,0.95); box-shadow: 0 16px 32px rgba(0,0,0,0.15); }
    .toast.show { transform: translateX(0); opacity: 1; }
    .toast-icon { background: var(--accent-glow); color: #fc8181; padding: 6px; border-radius: 6px; display: inline-flex; font-size: 1rem; flex-shrink: 0; }
    body.light-theme .toast-icon { color: #d6001c; }
    .toast-content { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .toast-title { font-weight: 600; font-size: 0.85rem; }
    body:not(.light-theme) .toast-title { color: #ffffff; }
    body.light-theme .toast-title { color: #111827; }
    .toast-body { font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
  </style>
</head>
<body>

  <div class="notif-overlay" id="notif-overlay"></div>

  <div class="notif-panel" id="notif-panel">
    <div class="notif-panel-header">
      <div class="notif-panel-title">
        <span>🔔</span> Notifications
      </div>
      <div class="notif-panel-actions">
        <button class="btn-notif-action" id="btn-mark-all-seen">Mark all seen</button>
        <button class="btn-notif-action danger" id="btn-clear-all">Clear all</button>
        <button class="btn-close-panel" id="btn-close-panel">✕</button>
      </div>
    </div>

    <div class="notif-tabs">
      <button class="notif-tab active" data-tab="all">All</button>
      <button class="notif-tab" data-tab="unread">Unread</button>
      <button class="notif-tab" data-tab="birthday">🎂 Birthdays</button>
      <button class="notif-tab" data-tab="anniversary">🏅 Anniversaries</button>
    </div>

    <div class="notif-list" id="notif-list"></div>
  </div>

  <header>
    <div class="brand-container">
      <img class="brand-logo" src="./fusion-logo.png" alt="Fusion Logo">
      <div class="brand-title">Staff<span>Ping</span></div>
    </div>
    <div class="header-actions">
      <button class="btn-control" id="theme-toggle">🌙 Dark Mode</button>

      <button class="notif-bell-btn" id="notif-bell-btn" title="Notifications">
        🔔
        <span class="notif-badge" id="notif-badge">0</span>
      </button>

      <div class="date-badge" id="today-badge"></div>
    </div>
  </header>

  <div class="app-viewport">
    <aside class="sidebar-panel">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="panel-title" id="form-panel-title">Add Employee</div>
        <button type="button" class="btn-control" id="btn-clear-form" style="font-size: 0.7rem; padding: 4px 8px;">Clear Form</button>
      </div>
      <div id="employee-form">
        <input type="hidden" id="edit-original-emp-id">
        <div class="form-group">
          <label for="emp-id">Employee ID</label>
          <input type="text" id="emp-id" placeholder="e.g. EMP-001" tabindex="1">
        </div>
        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" placeholder="e.g. Rajveer Singh" tabindex="2">
        </div>
        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" tabindex="3">
        </div>
        <div class="form-group">
          <label for="joining-date">Joining Date</label>
          <input type="date" id="joining-date" tabindex="4">
        </div>
        <button type="button" class="btn-primary" id="add-employee-btn" tabindex="5">Add Employee</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="view-header">
        <div class="counter-text" id="total-count-text">Total: <strong>0</strong> employees</div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <button class="btn-control" id="btn-import"> Import CSV</button>
          <button class="btn-control" id="btn-export"> Export CSV</button>
          <button class="btn-control btn-danger-control" id="btn-clear-data">Clear Data</button>
          <div class="search-container">
            <input type="text" id="search-input" placeholder="Search name or ID...">
          </div>
        </div>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Emp ID</th>
              <th>Name</th>
              <th>Date of Birth</th>
              <th>Joining Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="employee-table-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="toast" id="toast-notification">
    <div class="toast-icon" id="toast-icon-el">🔔</div>
    <div class="toast-content">
      <div class="toast-title" id="toast-title-text">Notification</div>
      <div class="toast-body" id="toast-body-text"></div>
    </div>
  </div>

  <script>
    // ── ELEMENT REFS ──
    const tableBody      = document.getElementById('employee-table-body');
    const searchInput    = document.getElementById('search-input');
    const totalCountText = document.getElementById('total-count-text');
    const submitBtn      = document.getElementById('add-employee-btn');
    const formPanelTitle = document.getElementById('form-panel-title');
    const editOrigEmpId  = document.getElementById('edit-original-emp-id');
    const idInput        = document.getElementById('emp-id');
    const nameInput      = document.getElementById('full-name');
    const dobInput       = document.getElementById('dob');
    const joiningInput   = document.getElementById('joining-date');
    const toastEl        = document.getElementById('toast-notification');
    const toastTitleEl   = document.getElementById('toast-title-text');
    const toastBodyEl    = document.getElementById('toast-body-text');
    const toastIconEl    = document.getElementById('toast-icon-el');
    const todayBadge     = document.getElementById('today-badge');
    const btnExport      = document.getElementById('btn-export'); 
    const btnImport      = document.getElementById('btn-import');
    const btnClearData   = document.getElementById('btn-clear-data');
    const btnClearForm   = document.getElementById('btn-clear-form');

    // Notification panel refs
    const notifBellBtn   = document.getElementById('notif-bell-btn');
    const notifBadge     = document.getElementById('notif-badge');
    const notifPanel     = document.getElementById('notif-panel');
    const notifOverlay   = document.getElementById('notif-overlay');
    const notifList      = document.getElementById('notif-list');
    const btnClosePanel  = document.getElementById('btn-close-panel');
    const btnMarkAllSeen = document.getElementById('btn-mark-all-seen');
    const btnClearAll    = document.getElementById('btn-clear-all');

    // Live date
    const now = new Date();
    todayBadge.textContent = 'Today: ' + now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

    let toastTimer;

    // ── DATA EXPORT LOGIC ──
    btnExport.addEventListener('click', async () => {
      const originalText = btnExport.innerText;
      btnExport.innerText = '⏳ Exporting...';
      btnExport.disabled = true;

      const result = await window.electronAPI.exportData();

      if (result.success) {
        showToast(`Export Complete: Saved to ${result.path}`);
      } else if (result.error !== 'CANCELLED') {
        showToast(`Export Failed: ${result.error}`, true);
      }

      // Restore button state
      btnExport.innerText = originalText;
      btnExport.disabled = false;
    });

    // ── DATA IMPORT LOGIC ──
    btnImport.addEventListener('click', async () => {
      const originalText = btnImport.innerText;
      btnImport.innerText = '⏳ Importing...';
      btnImport.disabled = true;

      const result = await window.electronAPI.importData();

      if (result.success) {
        showToast(`Import Complete: Successfully updated ${result.count} records.`);
        loadEmployees(); // Instantly refresh the data table
      } else if (result.error !== 'CANCELLED') {
        showToast(`Import Failed: ${result.error}`, true);
      }

      // Restore button state
      btnImport.innerText = originalText;
      btnImport.disabled = false;
    });

    // ── DATA CLEAR LOGIC ──
    btnClearData.addEventListener('click', async () => {
      const confirmClear = confirm('Are you sure you want to clear all employee data? This action cannot be undone.');
      if (!confirmClear) return;

      const originalText = btnClearData.innerText;
      btnClearData.innerText = '⏳ Clearing...';
      btnClearData.disabled = true;

      const result = await window.electronAPI.clearEmployees();

      if (result.success) {
        showToast('Clear Complete: All employee records have been removed.');
        resetForm();
        loadEmployees(); // Instantly refresh the data table
      } else {
        showToast(`Clear Failed: ${result.error}`, true);
      }

      // Restore button state
      btnClearData.innerText = originalText;
      btnClearData.disabled = false;
    });

    // ── FORM CLEAR LOGIC ──
    btnClearForm.addEventListener('click', resetForm);

    // ── THEME ──
    const themeToggleBtn = document.getElementById('theme-toggle');
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light-theme');
      themeToggleBtn.innerText = '☀️ Light Mode';
    }
    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      themeToggleBtn.innerText = isLight ? '☀️ Light Mode' : '🌙 Dark Mode';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    });

    // ── TOAST ──
    function showToast(msg, isError = false) {
      const colonIdx = msg.indexOf(': ');
      toastTitleEl.innerText = colonIdx !== -1 ? msg.slice(0, colonIdx) : (isError ? 'Error' : 'Info');
      toastBodyEl.innerText  = colonIdx !== -1 ? msg.slice(colonIdx + 2) : msg;
      toastIconEl.innerText  = isError ? '🚨' : '✅';
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 4500);
    }

    // ════════════════════════════════════════
    // ── NOTIFICATION STORE (localStorage) ──
    // ════════════════════════════════════════
    const NOTIF_KEY = 'staffping_notifications';
    let activeTab = 'all';

    function loadNotifStore() {
      try { return JSON.parse(localStorage.getItem(NOTIF_KEY)) || []; }
      catch { return []; }
    }

    function saveNotifStore(list) {
      localStorage.setItem(NOTIF_KEY, JSON.stringify(list));
    }

    // Detect type from message string
    function detectType(msg) {
      const m = msg.toLowerCase();
      if (m.includes('birthday') || m.includes('🎂')) return 'birthday';
      if (m.includes('anniversary') || m.includes('🏅')) return 'anniversary';
      return 'system';
    }

    // Add a new notification to the store
    function pushNotification(msg) {
      const list = loadNotifStore();
      const type = detectType(msg);

      // Deduplicate: same message on the same calendar date → skip
      const today = new Date().toDateString();
      const alreadyExists = list.some(n => n.msg === msg && n.date === today);
      if (alreadyExists) return;

      const notif = {
        id:   Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        msg,
        type,
        date: today,
        ts:   Date.now(),
        seen: false,
      };
      list.unshift(notif); // newest first

      // Keep max 100 entries
      if (list.length > 100) list.splice(100);
      saveNotifStore(list);
      renderNotifPanel();
    }

    // Mark one as seen
    function markSeen(id) {
      const list = loadNotifStore();
      const n = list.find(x => x.id === id);
      if (n) { n.seen = true; saveNotifStore(list); renderNotifPanel(); }
    }

    // Mark all as seen
    function markAllSeen() {
      const list = loadNotifStore().map(n => ({ ...n, seen: true }));
      saveNotifStore(list);
      renderNotifPanel();
    }

    // Delete one
    function dismissNotif(id) {
      const list = loadNotifStore().filter(n => n.id !== id);
      saveNotifStore(list);
      renderNotifPanel();
    }

    // Clear all
    function clearAllNotifs() {
      if (!confirm('Clear all notification history?')) return;
      saveNotifStore([]);
      renderNotifPanel();
    }

    // Update the badge count (unseen only)
    function updateBadge() {
      const unseen = loadNotifStore().filter(n => !n.seen).length;
      notifBadge.textContent = unseen > 99 ? '99+' : unseen;
      notifBadge.classList.toggle('visible', unseen > 0);
      notifBellBtn.classList.toggle('has-unread', unseen > 0);
    }

    // Relative time label
    function relTime(ts) {
      const diff = Date.now() - ts;
      const m = Math.floor(diff / 60000);
      const h = Math.floor(diff / 3600000);
      const d = Math.floor(diff / 86400000);
      if (m < 1)  return 'just now';
      if (m < 60) return `${m}m ago`;
      if (h < 24) return `${h}h ago`;
      if (d < 7)  return `${d}d ago`;
      return new Date(ts).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    }

    // Render the panel list
    function renderNotifPanel() {
      updateBadge();
      let list = loadNotifStore();

      // Filter by active tab
      if (activeTab === 'unread')      list = list.filter(n => !n.seen);
      if (activeTab === 'birthday')    list = list.filter(n => n.type === 'birthday');
      if (activeTab === 'anniversary') list = list.filter(n => n.type === 'anniversary');

      if (list.length === 0) {
        notifList.innerHTML = `
          <div class="notif-empty">
            <div class="notif-empty-icon">🔕</div>
            <div class="notif-empty-text">
              ${activeTab === 'unread' ? 'All caught up! No unread notifications.' : 'No notifications yet.'}
            </div>
          </div>`;
        return;
      }

      notifList.innerHTML = '';
      list.forEach(n => {
        const pillClass = n.type === 'birthday' ? 'pill-birthday' : n.type === 'anniversary' ? 'pill-anniversary' : 'pill-system';
        const pillLabel = n.type === 'birthday' ? '🎂 Birthday' : n.type === 'anniversary' ? '🏅 Anniversary' : '⚙ System';

        // Split msg into title / body at first ": "
        const colonIdx = n.msg.indexOf(': ');
        const cardTitle = colonIdx !== -1 ? n.msg.slice(0, colonIdx) : n.msg;
        const cardBody  = colonIdx !== -1 ? n.msg.slice(colonIdx + 2) : '';

        const card = document.createElement('div');
        card.className = 'notif-card' + (n.seen ? '' : ' unread');
        card.innerHTML = `
          <div class="notif-card-top">
            <div class="notif-card-icon">${n.type === 'birthday' ? '🎂' : n.type === 'anniversary' ? '🏅' : '🔔'}</div>
            <div class="notif-card-body">
              <div><span class="notif-type-pill ${pillClass}">${pillLabel}</span></div>
              <div class="notif-card-title">${cardTitle}</div>
              ${cardBody ? `<div class="notif-card-msg">${cardBody}</div>` : ''}
            </div>
            ${!n.seen ? '<div class="notif-card-unread-dot"></div>' : ''}
          </div>
          <div class="notif-card-footer">
            <span class="notif-card-time">${relTime(n.ts)}</span>
            <div class="notif-card-actions">
              ${!n.seen ? `<button class="btn-seen" onclick="markSeen('${n.id}')">✓ Mark seen</button>` : ''}
              <button class="btn-dismiss" onclick="dismissNotif('${n.id}')">✕ Remove</button>
            </div>
          </div>`;
        notifList.appendChild(card);
      });
    }

    // ── PANEL OPEN / CLOSE ──
    function openPanel() {
      notifPanel.classList.add('open');
      notifOverlay.classList.add('open');
      renderNotifPanel();
    }
    function closePanel() {
      notifPanel.classList.remove('open');
      notifOverlay.classList.remove('open');
    }

    notifBellBtn.addEventListener('click', openPanel);
    notifOverlay.addEventListener('click', closePanel);
    btnClosePanel.addEventListener('click', closePanel);
    btnMarkAllSeen.addEventListener('click', markAllSeen);
    btnClearAll.addEventListener('click', clearAllNotifs);

    // Tab switching
    document.querySelectorAll('.notif-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.notif-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeTab = tab.dataset.tab;
        renderNotifPanel();
      });
    });

    // ── PING from main process → store + toast ──
    window.electronAPI.onPing((msg) => {
      pushNotification(msg);   // save to history
      showToast(msg);          // also show toast
    });

    // On startup: show toast for any unseen notifications so user isn't surprised
    window.addEventListener('DOMContentLoaded', () => {
      const unseen = loadNotifStore().filter(n => !n.seen);
      if (unseen.length > 0) {
        showToast(`You have ${unseen.length} unread notification${unseen.length > 1 ? 's' : ''}. Click 🔔 to view.`);
      }
      updateBadge();
    });

    // ── LOAD EMPLOYEES ──
    async function loadEmployees() {
      const result = await window.electronAPI.getEmployees();
      if (!result.success) { showToast('Failed to load: ' + result.error, true); return; }

      const employees = result.data;
      const query = searchInput.value.toLowerCase();
      const filtered = employees.filter(emp =>
        emp.emp_id.toLowerCase().includes(query) ||
        emp.name.toLowerCase().includes(query)
      );

      tableBody.innerHTML = '';
      totalCountText.innerHTML = `Total: <strong>${employees.length}</strong> employees`;

      filtered.forEach(emp => {
        const tr = document.createElement('tr');
        let badgesHTML = '';
        if (emp.isBirthday)    badgesHTML += ` <span class="badge badge-birthday">🎂 Birthday</span>`;
        if (emp.isAnniversary) badgesHTML += ` <span class="badge badge-anniversary">🏅 Anniversary</span>`;
        const safeName = emp.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        tr.innerHTML = `
          <td class="emp-id-cell">${emp.emp_id}</td>
          <td class="emp-name-cell">${emp.name}</td>
          <td>${emp.dob_display}</td>
          <td>${emp.joining_date_display}${badgesHTML}</td>
          <td>
            <div class="actions-cell">
              <button class="btn-table btn-edit"
                onclick="startEdit('${emp.emp_id}','${safeName}','${emp.dob||''}','${emp.joining_date||''}')">Edit</button>
              <button class="btn-table btn-delete"
                onclick="deleteEmployee('${emp.emp_id}')">Delete</button>
            </div>
          </td>`;
        tableBody.appendChild(tr);
      });
    }

    // ── VALIDATE & SUBMIT ──
    async function validateAndSubmit() {
      let emp_id         = idInput.value.trim(); // Changed to 'let' so we can update it
      const name         = nameInput.value.trim();
      const dob          = dobInput.value;
      const joining_date = joiningInput.value;

      // Auto-pad manual numeric IDs with leading zeros (e.g., "8" becomes "008")
      if (emp_id && !isNaN(emp_id)) {
        emp_id = emp_id.padStart(3, '0');
      }

      if (!emp_id || !name || !dob || !joining_date) {
        showToast('Form Incomplete: Please fill in all fields.', true); return;
      }
      if (/^\d+$/.test(name)) {
        showToast('Validation Error: Full Name cannot be only numbers.', true);
        nameInput.focus(); return;
      }

      let result;
      if (editOrigEmpId.value) {
        result = await window.electronAPI.updateEmployee({
          original_emp_id: editOrigEmpId.value, emp_id, name, dob, joining_date
        });
      } else {
        result = await window.electronAPI.addEmployee({ emp_id, name, dob, joining_date });
      }

      if (result.success) {
        showToast(editOrigEmpId.value ? 'Updated: Employee record saved.' : 'Added: Employee added successfully.');
        resetForm();
        loadEmployees();
      } else {
        showToast('Error: ' + result.error, true);
      }
    }

    // ── BUTTON + ENTER NAV ──
    submitBtn.addEventListener('click', validateAndSubmit);
    idInput.addEventListener('keydown',      (e) => { if (e.key !== 'Enter') return; e.preventDefault(); nameInput.focus(); });
    nameInput.addEventListener('keydown',    (e) => {
      if (e.key !== 'Enter') return; e.preventDefault();
      if (/^\d+$/.test(nameInput.value.trim())) { showToast('Validation Error: Full Name cannot be only numbers.', true); return; }
      dobInput.focus();
    });
    dobInput.addEventListener('keydown',     (e) => { if (e.key !== 'Enter') return; e.preventDefault(); joiningInput.focus(); });
    joiningInput.addEventListener('keydown', (e) => { if (e.key !== 'Enter') return; e.preventDefault(); validateAndSubmit(); });

    // ── EDIT / RESET / DELETE ──
    function startEdit(emp_id, name, dob, joiningDate) {
      formPanelTitle.innerText = 'Edit Employee';
      submitBtn.innerText      = 'Save Changes';
      editOrigEmpId.value      = emp_id;
      idInput.value            = emp_id;
      nameInput.value          = name;
      dobInput.value           = dob;
      joiningInput.value       = joiningDate;
      idInput.focus();
    }
    function resetForm() {
      formPanelTitle.innerText = 'Add Employee';
      submitBtn.innerText      = 'Add Employee';
      editOrigEmpId.value = idInput.value = nameInput.value = dobInput.value = joiningInput.value = '';
    }
    async function deleteEmployee(emp_id) {
      if (!confirm(`Remove employee ${emp_id}?`)) return;
      const result = await window.electronAPI.deleteEmployee(emp_id);
      if (result.success) { showToast('Deleted: Employee removed.'); loadEmployees(); }
      else showToast('Error: ' + result.error, true);
    }

    searchInput.addEventListener('input', loadEmployees);
    loadEmployees();
  </script>
</body>
</html>
